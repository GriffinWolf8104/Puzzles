<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="theme-color" content="#111013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puzzles">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Phone app: pin to the whole screen (iOS leaves a strip at the bottom with height:100%) and keep buttons clear of the notch / island */
@media (max-width:520px),(max-height:640px){
  html,body{background:#111013}
  #stage{position:fixed;inset:0;height:auto}
  #stage .app{--top:max(20px,calc(env(safe-area-inset-top,0px) + 12px));--bot:max(8px,calc(env(safe-area-inset-bottom,0px) + 4px))}
}
@media (display-mode:standalone){html,body{min-height:100lvh}#stage{bottom:auto;height:100lvh}}
/* Lists scroll all the way to the bottom edge instead of stopping above it */
@media (max-width:520px),(max-height:640px){
  .screen:has(> .pager:last-child),.screen:has(> .scroll:last-child){padding-bottom:0}
  .page,.scroll{padding-bottom:calc(24px + var(--bot))}
}
</style>
<title>Puzzles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one iPhone-sized app. Framed on desktop, full screen on a phone. App colours come from the in-app Theme setting. */
:root{--page:#e6e4ec;--page-fg:#5a5666;--frame:#0d0c10;--display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#09080b;--page-fg:#8d889a;--frame:#000;color-scheme:dark}}
:root[data-theme="dark"]{--page:#09080b;--page-fg:#8d889a;--frame:#000;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--page-fg);font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.caption{font-size:12.5px;letter-spacing:.04em;color:var(--page-fg)}

/* ---------- app themes ---------- */
.app{--bg:#111013;--surface:#1c1b21;--surface2:#29272f;--line:#302e37;--text:#f2f0f6;--muted:#9a96a7;--danger:#ff6b6b;--acc:#8b5cf6;--acc-ink:#fff;--strong:#6c6879;--rs:34%;--rl:30%;--kline:#0b0a0d}
.app[data-theme="light"]{--bg:#f3f2f6;--surface:#fff;--surface2:#e7e5ee;--line:#e0dee7;--text:#1a1820;--muted:#6f6a7c;--danger:#d93a3a;--strong:#3a3644;--rs:68%;--rl:84%;--kline:#2a2731}
.app[data-accent="purple"]{--acc:#8b5cf6}
.app[data-accent="red"]{--acc:#f0545a;--danger:#ffb020}
.app[data-accent="blue"]{--acc:#4b8bff}
.app[data-accent="green"]{--acc:#2fb36d}
.app[data-accent="teal"]{--acc:#22b5b0}
.app[data-accent="orange"]{--acc:#f28a2e}
.app[data-accent="pink"]{--acc:#ec5fa8}
.app[data-accent="gold"]{--acc:#e8b625;--acc-ink:#1a1508}
.app[data-theme="light"][data-accent="purple"]{--acc:#7343e6}
.app[data-theme="light"][data-accent="red"]{--acc:#d8343c;--danger:#d97800}
.app[data-theme="light"][data-accent="blue"]{--acc:#2a69dd}
.app[data-theme="light"][data-accent="green"]{--acc:#1f8f55}
.app[data-theme="light"][data-accent="teal"]{--acc:#138a87}
.app[data-theme="light"][data-accent="orange"]{--acc:#d4690f}
.app[data-theme="light"][data-accent="pink"]{--acc:#cf3f8b}
.app[data-theme="light"][data-accent="gold"]{--acc:#b38500;--acc-ink:#fff}
.app[data-theme="love"][data-accent]{--bg:#141315;--surface:#222025;--surface2:#2e2b32;--line:#38343d;--text:#f3e9d4;--muted:#a69e8f;--acc:#a983e2;--acc-ink:#141315;--danger:#ff8a7a;--strong:#6d6672;--rs:22%;--rl:31%;--kline:#0c0b0d}

.app{position:relative;width:393px;height:min(852px,calc(100% - 64px));border-radius:56px;border:11px solid var(--frame);overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 30px 80px -20px rgba(0,0,0,.45),0 0 0 1px rgba(127,127,127,.25);--top:50px;--bot:20px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s}
.app::before{content:"";position:absolute;top:10px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:50;pointer-events:none}
.app::after{content:"";position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);opacity:.35;z-index:50;pointer-events:none}
.sb{position:absolute;top:18px;left:34px;font-weight:600;font-size:15px;z-index:40;pointer-events:none}
@media (max-width:520px),(max-height:640px){
  #stage{gap:0}.caption{display:none}
  .app{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;--top:2px;--bot:4px}
  .app::before,.app::after,.sb{display:none}
}
.app *,.app *::before,.app *::after{box-sizing:border-box}
.app svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:where(.app button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* Keyboard focus ring, only on devices with a mouse or keyboard (iPhone was drawing it around tapped squares) */
@media (hover:hover) and (pointer:fine){.app button:focus-visible,.app input:focus-visible,.app textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}}
.app .sc:focus-visible,.app .kc:focus-visible{outline:none}

/* ---------- navigation stack ---------- */
.screens{position:absolute;inset:0;overflow:hidden}
/* Room for a video: the screen's content moves out of the strip a floating video covers */
.app[data-pip="top"]{--top:280px !important}.app[data-pip="bottom"]{--bot:266px !important}
.pipzone{display:none}.app[data-pip] .pipzone{position:absolute;left:14px;right:14px;z-index:5;pointer-events:none;border:2px dashed var(--line);border-radius:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;font-weight:600}
.app[data-pip="top"] .pipzone{top:60px;height:206px}.app[data-pip="bottom"] .pipzone{bottom:16px;height:236px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--top);padding-bottom:var(--bot);background:var(--bg);transition:transform .34s cubic-bezier(.2,.8,.2,1),filter .34s,background .3s;will-change:transform}
.screen.enter{transform:translateX(100%)}
.screen.behind{transform:translateX(-22%);filter:brightness(.7)}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 12px;flex:none}
.bar .grp{display:flex;gap:2px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.ib:active{background:var(--surface2)}
.ib.solid{background:var(--surface)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.h1{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.025em;line-height:1.05;padding:2px 22px 16px;text-wrap:balance}
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);padding:0 22px 2px}

/* ---------- home ---------- */
.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;padding:6px 22px 20px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile .art{width:100%;aspect-ratio:1;border-radius:30px;background:var(--surface);display:grid;place-items:center;transition:transform .18s}
.tile:active .art{transform:scale(.95)}
.tile .art svg{width:80%;height:80%;stroke:none}
.pill{padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14.5px;background:var(--bg)}
.tile.soon .art{background:transparent;border:2px dashed var(--line)}
.tile.soon .pill{color:var(--muted)}
.badge{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tile .art{position:relative}
.dots{display:flex;justify-content:center;gap:8px;padding:10px 0 14px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.dots i.on{background:var(--acc);width:20px;border-radius:4px}
.a-surf{fill:var(--surface2)}.a-line{stroke:var(--strong);stroke-width:1.4;fill:none}.a-thin{stroke:var(--line);stroke-width:1;fill:none}
.a-text{fill:var(--text);font:700 15px var(--ui)}.a-acc{fill:var(--acc)}.a-accs{stroke:var(--acc);fill:none;stroke-width:2.4}.a-muted{fill:var(--muted)}
.an{font:700 11px var(--ui);text-anchor:middle;dominant-baseline:central;fill:var(--text)}
.an.acc{fill:var(--acc)}.an.ink{fill:var(--acc-ink)}.an.q{fill:var(--muted);font-size:8px}
.an.sum{font-size:7px;text-anchor:start;dominant-baseline:hanging}.an.n1{fill:#4b8bff}.an.n2{fill:#33b07a}
.a-dash{stroke:var(--acc);stroke-width:1.6;stroke-dasharray:3 2.4;fill:none}

/* ---------- lists (settings) ---------- */
.glabel{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 34px 8px}
.group{margin:0 16px;background:var(--surface);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.row .lab{flex:1;min-width:0}
.row .lab small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.hintcard{display:flex;align-items:center;gap:10px;margin:0 16px 8px;padding:10px 10px 10px 14px;background:var(--surface);border-radius:18px;flex:none;border:1.5px solid color-mix(in srgb,var(--acc) 45%,transparent)}.hintcard[hidden]{display:none}
.hintcard p{flex:1;font-size:14px;line-height:1.35;margin:0}.hintcard .hcb{display:flex;align-items:center;gap:2px;flex:none}.hintcard .btn{height:38px;width:auto;padding:0 14px;font-size:15px !important}.hintcard .ib{width:36px;height:36px}.hintcard .ib svg{width:18px;height:18px}
.hint-a{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 60%,transparent) !important}
.hint-t{box-shadow:inset 0 0 0 3.5px var(--acc) !important;animation:hintp 1.1s ease-in-out infinite alternate;z-index:2}
@keyframes hintp{to{box-shadow:inset 0 0 0 3.5px var(--acc),0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}}
.imsec{padding:0 16px 8px}.imsec .m{margin:0 0 12px}.impick{cursor:pointer}.imstat{margin-top:10px !important;color:var(--text)}
.tarea{width:100%;min-height:96px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:12px;font:14px/1.4 ui-monospace,Menlo,monospace;resize:none;box-sizing:border-box;user-select:text;-webkit-user-select:text;margin-bottom:6px}
.igrid{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;width:100%;max-width:340px;margin:0 auto;border:2px solid var(--strong);border-radius:12px;overflow:hidden;container-type:inline-size;background:var(--surface)}
.ic{border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:6.4cqi;font-weight:700;color:var(--text);display:grid;place-items:center}
.ic:nth-child(9n){border-right:0}.ic:nth-last-child(-n+9){border-bottom:0}.ic.bR{border-right:2px solid var(--strong)}.ic.bB{border-bottom:2px solid var(--strong)}
.ic.sel{background:color-mix(in srgb,var(--acc) 38%,var(--surface))}.ic.bad{color:var(--danger)}
.ipad{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:340px;margin:12px auto 4px}.ipad button{height:40px;border-radius:12px;background:var(--surface);font-weight:700;font-size:18px;display:grid;place-items:center}.ipad svg{width:20px;height:20px}
.hpill{height:36px;padding:0 12px 0 9px;border-radius:99px;display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;background:var(--surface);color:var(--text);margin-right:4px;white-space:nowrap}.hpill[hidden]{display:none}
.hpill svg{width:18px;height:18px}.hpill.acc{background:var(--acc);color:var(--acc-ink)}
.dbanner[hidden]{display:none}
.ordrow{gap:4px}.ordrow .ib[disabled]{opacity:.25}.ordrow .ib svg{width:22px;height:22px}
.resume{display:flex;align-items:center;gap:12px;margin:0 16px 14px;padding:10px 14px 10px 10px;background:var(--surface);border-radius:20px;text-align:left;flex:none}
.resume[hidden]{display:none}
.dbanner{display:flex;align-items:center;gap:14px;margin:0 16px 12px;padding:12px 14px 12px 12px;border-radius:22px;text-align:left;flex:none;background:var(--acc);color:var(--acc-ink)}
.dbanner .art{width:52px;height:52px;border-radius:15px;background:color-mix(in srgb,var(--acc-ink) 16%,transparent);display:grid;place-items:center;flex:none}
.app .dbanner .art svg{width:86%;height:86%;stroke:none}
.dbanner .rl{flex:1;min-width:0}.dbanner b{display:block;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em}
.dbanner small{font-size:13.5px;opacity:.85}.dbanner .chev{width:18px;height:18px;opacity:.8}
.dbanner:active{transform:scale(.98)}
.resume .art{width:46px;height:46px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;flex:none}
.app .resume .art svg,.app .hart svg{width:82%;height:82%;stroke:none}
.resume .rl{flex:1;min-width:0}.resume b{display:block;font-size:17px;color:var(--acc)}.resume small{color:var(--muted);font-size:13.5px}
.resume .chev{color:var(--muted);width:18px;height:18px}
.bsub{font-weight:600;opacity:.75;font-size:15px}.bsub::before{content:"·";margin:0 8px 0 2px}
.hrow{min-height:58px}.hart{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;flex:none}
.hrow .val{font-variant-numeric:tabular-nums;white-space:nowrap}.hrow .val.win{color:var(--text);font-weight:600}.hrow .val svg{width:18px;height:18px;color:var(--acc)}
.hempty{text-align:center;padding:40px 30px}
.lbtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 14px;scrollbar-width:none}.lbtabs::-webkit-scrollbar{display:none}
.lbtabs .chip{flex:none;padding:8px 15px}.lbtabs .chip.on{background:var(--acc);color:var(--acc-ink)}
.lbname .row{margin:0 16px 12px;width:calc(100% - 32px);background:var(--surface);border-radius:16px}
.lbrow .rank{width:26px;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lbrow .rank.r1,.lbrow .rank.r2,.lbrow .rank.r3{color:var(--acc)}
.lbrow .lab{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbrow em{font-style:normal;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--acc-ink);background:var(--acc);border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:1px}
.lbrow.me{background:color-mix(in srgb,var(--acc) 10%,var(--surface))}.lbrow .val{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.lbh svg{width:16px;height:16px;color:var(--muted)}
.tin{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);padding:0 14px;font:600 17px var(--ui);margin:4px 0 16px;user-select:text;-webkit-user-select:text}
.tin:focus{outline:none;border-color:var(--acc)}
.dhead{display:flex;flex-direction:column;gap:2px;padding:0 24px 14px;color:var(--muted);font-size:14px}.dhead b{color:var(--text);font-size:17px}
.drow .val.play{color:var(--acc);font-weight:700}.dnote{text-align:center;padding:16px 28px;font-size:13.5px}.dnext{color:var(--text);font-weight:600}
.dtag{display:inline-block;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-right:7px;vertical-align:1px}.hclear{padding:18px 16px 0}
.row .val{color:var(--muted);font-size:14.5px}
.row .chev{color:var(--muted);width:16px;height:16px}
.row:active{background:var(--surface2)}
.row .tick{color:var(--acc);opacity:0;transition:opacity .15s}
.row.on .tick{opacity:1}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:var(--surface2);position:relative;transition:background .2s;flex:none;cursor:pointer;margin:0}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:var(--acc)}
.sw:checked::before{transform:translateX(20px)}
.dis{opacity:.4;pointer-events:none}
.note{color:var(--muted);font-size:13px;padding:8px 34px 0}

.row.slide{gap:14px}
.row.slide .lab{flex:0 0 74px}
.row.slide input{flex:1;min-width:0;accent-color:var(--acc)}
.row.slide .sv{width:30px;text-align:right;font-variant-numeric:tabular-nums}
.group.dim{opacity:.6}
/* theme page */
.accent-box{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;align-items:stretch}
.preview{border-radius:14px;background:var(--bg);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.preview b{font-family:var(--display);font-size:17px}
.preview .pv-t{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preview .pv-t i{aspect-ratio:1;border-radius:8px;background:var(--surface2)}
.preview .pv-b{height:22px;border-radius:99px;background:var(--acc)}
.swatches{display:flex;flex-direction:column;gap:2px}
.swatch{padding:6px 10px !important}
.swatch{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1.5px solid transparent;font-weight:600}
.swatch i{width:22px;height:22px;border-radius:50%}
.swatch.on{border-color:var(--acc);background:var(--surface2)}
.love-dots{display:flex}
.love-dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;box-shadow:0 0 0 1px var(--line)}

/* ---------- landing ---------- */
.landing{flex:1;display:flex;flex-direction:column;padding:0 28px 18px;min-height:0}
.landing .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
.landing .hero .art{width:150px;height:150px;border-radius:38px;background:var(--surface);display:grid;place-items:center}
.landing .hero .art svg{width:82%;height:82%;stroke:none}
.app .art img{width:74%;height:74%;object-fit:contain;border-radius:16px}
.landing h1{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.03em;line-height:1;text-align:center}
.landing.saved .hero{gap:10px}.landing.saved .hero .art{width:118px;height:118px;border-radius:30px}.landing.saved h1{font-size:40px}
@media (max-height:700px){.landing.saved .btns{gap:9px}.landing.saved .btn{height:52px}.landing.saved .btn.ghost{height:40px}}
.landing .sub{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;background:var(--surface);font-weight:600;font-size:14px}
.chip svg{width:14px;height:14px;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:12px;flex:none}
.btn{height:58px;border-radius:999px;font-size:18px !important;font-weight:700 !important;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--acc-ink) !important}
.btn.outline{background:var(--surface);border:1.5px solid var(--line) !important}
.btn.ghost{color:var(--muted) !important;height:48px}

/* ---------- game shell ---------- */
.gbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 10px;flex:none}
.gbar .r{justify-self:end}
.timer{font-variant-numeric:tabular-nums;background:var(--surface);padding:8px 18px;border-radius:999px;font-weight:700;min-width:96px;text-align:center;font-size:15.5px}
.timer.off{color:var(--muted);font-weight:600}
.gtitle{text-align:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);padding:2px 0 8px;letter-spacing:.01em;flex:none;font-variant-numeric:tabular-nums}
.gtitle b{color:var(--text)}
.gmain{flex:1;display:flex;flex-direction:column;align-items:stretch;padding:0 12px;gap:14px;min-height:0}
.bwrap{flex:1;min-height:0;display:grid;place-items:center}
.gextra{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.gextra:empty{display:none}
.gfoot{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 8px;flex:none;min-height:56px}
.tbtn{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;font-weight:600;font-size:15px;transition:background .15s,color .15s}
.tbtn:active{background:var(--surface2)}
.tbtn.on{background:var(--acc);color:var(--acc-ink)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* sudoku */
.sgrid{position:relative;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);background:var(--surface);border-radius:12px;overflow:hidden;border:2px solid var(--strong);container-type:inline-size}
.sc{position:relative;display:grid;place-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:6.4cqi;font-weight:500;color:var(--acc);font-variant-numeric:tabular-nums;transition:background .12s}
.sgrid .sc:nth-child(9n){border-right:0}.sgrid .sc:nth-child(n+73){border-bottom:0}
.sc.bR{border-right:2px solid var(--strong)}.sc.bB{border-bottom:2px solid var(--strong)}
.sc.g{color:var(--text);font-weight:700}
.sc.peer{background:color-mix(in srgb,var(--acc) 9%,var(--surface))}
.sc.same{background:color-mix(in srgb,var(--acc) 24%,var(--surface))}
.sc.sel{background:color-mix(in srgb,var(--acc) 38%,var(--surface))}
.sc.wrong{color:var(--danger)}
.sc.flash::after{content:"";position:absolute;inset:0;background:var(--acc);opacity:0;animation:flash .7s;pointer-events:none}
@keyframes flash{0%{opacity:.85}}
.nt{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:2.6cqi;color:var(--muted);font-weight:600;line-height:1}
.nt span{display:grid;place-items:center}
/* pencil marks matching the selected number */
.nt span.hl{background:var(--acc);color:var(--acc-ink,#fff);border-radius:50%;width:88%;aspect-ratio:1;margin:auto;font-weight:800}
.app svg.cages{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;fill:none;stroke:var(--muted);stroke-width:3;stroke-dasharray:9 7;stroke-linecap:butt;opacity:.85}
.csum{position:absolute;top:1px;left:1px;font-size:2.3cqi;font-weight:700;color:var(--text);line-height:1;background:var(--surface);padding:1px 2px 2px 1px;border-radius:0 0 3px 0;z-index:2}
.sc.peer .csum,.sc.same .csum,.sc.sel .csum{background:inherit}
.pad{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px}
.pad .pr{display:flex;justify-content:space-between}
.num{width:54px;height:54px;border-radius:50%;background:var(--surface);font-size:23px !important;font-weight:600 !important;display:grid;place-items:center;transition:transform .1s,background .15s}
.num:active{transform:scale(.9);background:var(--surface2)}
.num.done{opacity:.3}
.pencil-on .num{color:var(--acc);font-size:18px !important}

.xgrid{display:grid;container-type:inline-size;background:var(--surface)}
.xgrid .sc{border-style:solid;font-size:calc(100cqi / var(--cols) * .6)}
.xgrid .nt{font-size:calc(100cqi / var(--cols) * .27);inset:1px}
.xoff{background:var(--bg)}
.bwrap.zoom{overflow:auto;display:block;-webkit-overflow-scrolling:touch}
/* towers */
.tower{display:flex;flex-direction:column;gap:5px;width:100%;max-width:340px;max-height:100%;overflow-y:auto;padding:2px 2px 4px;scrollbar-width:none}
.trow{flex:none;display:flex;align-items:center;gap:10px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--surface)}
.trow.future{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.trow.future .tb{background:transparent}
.trow.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.trow.code{background:var(--surface2)}
.tn{width:16px;flex:none;font-size:11px;color:var(--muted);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.tslots{flex:1;display:flex;justify-content:space-around;gap:6px}
.tb{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);position:relative;transition:transform .12s}
.tb.empty{background:var(--surface2)}
.tb.q{background:var(--surface);color:var(--muted);font-weight:800;font-size:13px;font-style:normal}
.tb.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.tb.lock::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
button.tb:active{transform:scale(.92)}
.tfb{flex:none;width:30px;display:grid;grid-template-columns:repeat(var(--pc,3),8px);gap:3px;justify-content:end}
.pk{display:inline-block;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);font-style:normal}
.pk.ex{background:var(--text);box-shadow:none}
.pk.near{box-shadow:inset 0 0 0 1.8px var(--text)}
.tpal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tcol{width:40px;height:40px;border-radius:50%;background:var(--c);position:relative;transition:transform .1s,opacity .2s}
.tcol:active{transform:scale(.9)}
.tcol.out{opacity:.22}
.tact{display:flex;gap:10px;width:100%;max-width:340px;margin:0 auto}.tundo{width:auto;flex:0 0 auto;padding:0 18px;height:50px !important;font-size:16px !important;background:var(--surface);border-radius:999px}.tundo svg{width:20px;height:20px}
.tcheck{flex:1;max-width:340px;height:50px !important;font-size:17px !important}
.tkey{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.tkey .pk{margin-left:6px}
.sheet .tower.reveal{margin:4px 0 6px;max-width:260px}
/* minesweeper */
.mgrid{display:grid;gap:3px;container-type:inline-size}
.mc{border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:calc(100cqi / var(--cols) * .5);font-variant-numeric:tabular-nums;transition:background .12s}
.mc.o{background:var(--surface)}
.mc.o.n1{color:var(--mn1)}.mc.o.n2{color:var(--mn2)}.mc.o.n3{color:var(--mn3)}.mc.o.n4{color:var(--mn4)}.mc.o.n5{color:var(--mn5)}.mc.o.n6{color:var(--mn6)}.mc.o.n7{color:var(--mn7)}.mc.o.n8{color:var(--mn8)}
.mc svg{width:58%;height:58%}
.mc.f{color:var(--acc)}
.mc.f.wrong{background:color-mix(in srgb,var(--danger) 30%,var(--surface2));color:var(--danger)}
.mc.boom{background:var(--danger);color:#fff}
.mc.m{color:var(--text)}
.still *,.still *::before,.still *::after{transition:none!important;animation:none!important}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px}
.seg button{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14.5px;transition:background .15s,color .15s}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.seg svg{width:18px;height:18px}

/* kings */
.kgrid{display:grid;border:2.5px solid var(--kline);border-radius:10px;overflow:hidden;container-type:inline-size}
.kc{display:grid;place-items:center;background:hsl(var(--h) var(--rs) var(--rl));border-top:1px solid color-mix(in srgb,var(--kline) 22%,transparent);border-left:1px solid color-mix(in srgb,var(--kline) 22%,transparent);color:var(--kline);position:relative}
.kc.bt{border-top:2.5px solid var(--kline)}.kc.bl{border-left:2.5px solid var(--kline)}
.app[data-theme="dark"] .kc,.app[data-theme="love"] .kc,.app[data-tone="dark"] .kc{color:var(--text)}
.kc .dot{width:16%;height:16%;border-radius:50%;background:currentColor;opacity:.55}
.kc .dot.auto{opacity:.3}
.kc svg.crown{width:62%;height:62%;fill:currentColor;stroke:none;animation:pop .2s}
.kc.bad{color:var(--danger)}
.kc.bad::after{content:"";position:absolute;inset:0;background:var(--danger);opacity:.18}
@keyframes pop{from{transform:scale(.4)}}
.krow{font-size:13px;color:var(--muted);text-align:center}

/* atoms */
.app svg.asvg{display:block;overflow:visible;touch-action:none;stroke:none;stroke-width:0;fill:none;width:auto;height:auto}
.asvg .bond{stroke:var(--text);stroke-width:1;stroke-linecap:round}
.asvg .ghost{stroke:var(--acc);stroke-width:.6;stroke-dasharray:1 1.2;opacity:.6}
.asvg .node{fill:var(--surface);stroke:var(--strong);stroke-width:.6;transition:fill .15s}
.asvg .node.full{fill:var(--acc);stroke:var(--acc)}
.asvg .node.over{stroke:var(--danger);stroke-width:1;fill:color-mix(in srgb,var(--danger) 25%,var(--surface))}
.asvg .node.sel{stroke:var(--acc);stroke-width:1.2}
.asvg .node.cand{stroke:var(--acc);stroke-width:.9}
.asvg text{font:700 4.4px var(--ui);fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.asvg text.full{fill:var(--acc-ink)}
.asvg .gridd{fill:var(--line)}
.asvg .dline{stroke:var(--acc);stroke-width:1.3;stroke-linecap:round;opacity:.9}
.asvg .dline.loose{stroke-width:.8;stroke-dasharray:1.2 1.2;opacity:.6}
.asvg .dline.bad,.asvg .dring.bad{stroke:var(--danger)}
.asvg .dring{fill:none;stroke:var(--acc);stroke-width:.8}

/* sets */
.setgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.app svg.sdefs{position:absolute;width:0;height:0}
.scard{background:var(--surface);border-radius:12px;display:grid;place-items:center;border:2px solid transparent;transition:transform .12s,border-color .12s,background .12s;min-height:0;padding:0}
.app .scard svg{width:96%;height:96%}
.scard.sel{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 6px 16px -8px rgba(0,0,0,.45)}
.scard.hint{border-color:var(--acc);border-style:dashed}
.scard.got{animation:got .45s}
@keyframes got{40%{transform:scale(1.06)}}
.gextra.top{order:-1}
.bwrap.top{align-items:start}
.sfound{display:grid;grid-template-columns:repeat(var(--k),1fr);gap:6px;width:100%;max-width:380px}
.sf{height:84px;border-bottom:3px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;padding:0 0 3px}
.sf.on{border-bottom-color:var(--acc)}
.sf i{width:100%;max-width:54px;height:25px;border-radius:5px;background:var(--surface);display:grid;place-items:center}.app .sf svg{width:100%;height:100%}
.lives{display:flex;gap:3px;justify-content:center}
.smsg{min-height:20px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:center;padding:0 8px}
.setgrid{position:relative}
.app .ssub{position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);height:48px;width:auto;padding:0 38px;font-size:16px !important}
.app .ssub:active{transform:translateX(-50%) scale(.97)}
.ssub:disabled{opacity:.4}
.gextra.top{gap:8px;margin-bottom:34px}
.lives.tl{margin-top:6px}.lives.tl i{width:20px;height:20px}
.lives i{width:22px;height:22px;color:var(--line)}.lives i.on{color:var(--danger)}
.lives svg{width:100%;height:100%;fill:currentColor;stroke:none}
.wtries{font-family:var(--display);font-weight:800;font-size:22px;color:var(--text);margin:0 0 4px}
/* dailys levels */
.dlcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.dlcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 14px;border-radius:24px;background:var(--surface);text-align:left;min-height:210px}
.dlcard.hard{background:var(--acc);color:var(--acc-ink)}
.dlcard .art{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 10%,transparent);margin-bottom:auto}
.dlcard .art svg{width:86%;height:86%}
.dlcard b{font-family:var(--display);font-weight:800;font-size:24px;margin-top:14px}
.dlcard small{font-size:13px;opacity:.8;line-height:1.3}
.dlcard .dlcount{font-size:12.5px;font-weight:700;opacity:.9;margin-top:6px}
.dlcard:active{transform:scale(.98)}
.dlseg{display:flex;justify-content:center;padding:0 16px 14px}
.lbnone{padding:0 24px 6px}.lblevel + .lblevel{margin-top:26px}.lbt{font-weight:800}
/* settings: sets colours */
.scols{display:flex;gap:4px}.scols i{width:16px;height:16px;border-radius:50%}
.scrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.sclab{width:58px;height:40px;flex:none;background:var(--bg);border-radius:10px;display:grid;place-items:center}.sclab svg{width:100%;height:100%}
.scsw{display:flex;flex-wrap:wrap;gap:5px}
.scsw button{width:23px;height:23px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.scsw button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
/* puzzle colours */
.swatch i.cw{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.scols i{border:1px solid rgba(127,127,127,.35)}
.cshape{width:30px;height:30px;flex:none;display:grid;place-items:center}.app .cshape svg{width:30px;height:30px}
.csw{width:26px;height:26px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}
.note.top{padding-top:0;margin-top:-6px}
.cbtns{padding:18px 16px 0}
.cpre{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:6px 0 16px}
.cpre button{aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}
.cpre button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.cpre .cdef{grid-column:span 2;aspect-ratio:auto;border-radius:99px;font-size:12.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cown{display:flex;gap:10px;align-items:center}
.cwheel{position:relative;flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px 0 8px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line);font-weight:600;font-size:15px;margin:4px 0 16px;cursor:pointer}
.cwheel::before{content:"";width:34px;height:34px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}
.cwheel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chex{font-family:ui-monospace,Menlo,monospace;text-transform:lowercase}
.scsw .cust{display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1;color:var(--text);background:var(--c);box-shadow:inset 0 0 0 1.5px var(--strong)}
.scsw .cust svg{width:14px;height:14px}
/* ---------- sheets & toast ---------- */
.sheetRoot{position:absolute;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 22px calc(var(--bot) + 22px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:85%;overflow-y:auto}
.sheetRoot.open .scrim{opacity:1}.sheetRoot.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0 0 10px}
.sheet p{margin:0 0 10px;color:var(--text);line-height:1.5;max-width:60ch}
.sheet p.m{color:var(--muted);font-size:14px}
.sheet ul{margin:0 0 14px;padding-left:20px;line-height:1.5}
.sheet li{margin-bottom:6px}
.sheet .btns{margin-top:16px}
.sheet textarea{width:100%;min-height:110px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);padding:12px;font:14px/1.4 ui-monospace,Menlo,monospace;resize:none;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.bigtime{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--acc);line-height:1;margin:4px 0 6px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:6px}
.toast{position:absolute;left:50%;bottom:calc(var(--bot) + 90px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:40;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.app *,.app{transition:none!important;animation:none!important}}

/* chess */
.app svg.pc{display:block;width:100%;height:100%;pointer-events:none;overflow:visible}
.pc .b{fill:var(--pf);stroke:var(--po);stroke-width:3.2;stroke-linejoin:round}
.pc .d{fill:none;stroke:var(--pd);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pc .k{fill:var(--pd)}
.pw{--pf:#fbf7ee;--po:#26212c;--pd:#26212c}
.pb{--pf:#2e2936;--po:#0e0c11;--pd:#ece6d8}
.chb{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:12px;overflow:hidden;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.chs{position:relative;background:var(--chl)}.chs.d{background:var(--chd)}
.app .chs .pc{position:absolute;left:5%;top:5%;width:90%;height:90%;z-index:1}
.app .chs .pc.drag{z-index:5;transition:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.chs.last::before,.chs.sel::before{content:'';position:absolute;inset:0;background:var(--acc);opacity:.34}
.chs.sel::before{opacity:.6}
.chs.chk::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(235,50,50,.95) 0,rgba(235,50,50,.5) 45%,rgba(235,50,50,0) 75%)}
.chs.mv::after{content:'';position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(20,18,24,.28);z-index:2}
.chs.cap::after{content:'';position:absolute;inset:3%;border-radius:50%;border:4px solid rgba(20,18,24,.3);z-index:2}
.chs .co{position:absolute;font-style:normal;font-size:9.5px;font-weight:800;line-height:1;left:3px;top:3px;color:var(--chd);z-index:3}
.chs.d .co{color:var(--chl)}
.chs .co.cf{left:auto;top:auto;right:3px;bottom:2px}
.charrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.charrow line{stroke:#2fb36d;stroke-width:.17;stroke-linecap:round;opacity:.85}.charrow path{fill:#2fb36d;opacity:.85}
.chcapw{width:100%;padding:0 16px}
.chcap{display:flex;justify-content:space-between;gap:12px;min-height:24px}
.chcap span{display:flex;align-items:center;flex-wrap:wrap}
.app .chcap .pc{width:20px;height:20px;margin-right:-5px}
.chcap b{font-size:13px;color:var(--muted);margin-left:9px}
.chturn{font-weight:700;font-size:14.5px;padding:7px 13px;border-radius:99px;background:var(--acc);color:var(--acc-ink)}
.chturn.wait{background:var(--surface);color:var(--muted)}
.chpromo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 10px}
.chpromo button{aspect-ratio:1;border-radius:18px;background:var(--surface2);padding:8px}
.chpz{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:0 18px;min-height:46px}
.chpz b{font-size:16px}.chpz span{font-size:14px;color:var(--muted)}
.chcards .dlcard{min-height:200px}
.chcards .dlcard .art{width:76px;height:76px;border-radius:20px}
.chwide{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);margin:12px 16px 0;padding:14px;border-radius:24px;background:var(--surface);text-align:left}
.chwide .art{width:58px;height:58px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;flex:none}
.chwide .art svg{width:86%;height:86%}
.chwide .rl{flex:1;display:flex;flex-direction:column;gap:2px}.chwide b{font-family:var(--display);font-weight:800;font-size:21px}.chwide small{color:var(--muted);font-size:13.5px}

  // How to play (opens from How? on each start screen)
  howTo: {
    chessFriend: `<li>One of you taps <b>Create a game</b> and sends the code or link.</li><li>The other taps <b>Join a game</b> and pastes it. The game starts straight away on both phones.</li><li>Each phone shows the other's move a moment after it's made. Keep the app open while you play.</li><li>Left by accident? Join again with the same code to carry on.</li><li>No undo or hints against a friend. Tap <b>Resign</b> to give up.</li>`,
    chess: `<li>Checkmate the other king: attack it so it has no way out.</li><li>Tap a piece to see where it can go, then tap a square. You can drag pieces too.</li><li>Pick the bot's level with the button on this screen. <b>Loki</b> is the easiest.</li><li>After a game, tap <b>Review game</b> to see your best moves and mistakes.</li><li>Board colours, piece sets and undo are in Settings under Chess.</li>`,
    classic: `<li>Fill every row, column and 3×3 box with the numbers 1 to 9, each once.</li><li>Tap a square, then a number. Tap the same number again to clear it.</li><li>Turn on <b>Pencil</b> to jot small notes in a square.</li>`,
    killer: `<li>Normal sudoku rules: 1 to 9 once in every row, column and 3×3 box.</li><li>Dashed cages show a sum. The numbers in a cage add up to it and never repeat inside the cage.</li><li>Use <b>Pencil</b> for notes.</li>`,
    samurai: `<li>Five sudokus overlap. Every row, column and 3×3 box in each of the five grids holds 1 to 9 once.</li><li>The corner boxes of the middle grid are shared with the outer grids, so they have to work for both.</li><li>Tap <b>Zoom</b> to get a closer look and scroll around the board.</li>`,

    '700 80px "Bricolage Grotesque","Avenir Next",sans-serif', '400 80px Georgia,"Times New Roman",serif', '700 80px Georgia,"Times New Roman",serif', '400 80px "Courier New",monospace', '700 80px Verdana,sans-serif'];

// Daily times go to a small online table (Supabase). Unsent times wait on the phone until it's back online.
const lbOn = () => !!(LEADERBOARD.url && LEADERBOARD.key);
const lbApi = path => LEADERBOARD.url.replace(/\/+$/, '') + '/rest/v1/' + path;
const lbHeaders = () => Object.assign({ apikey: LEADERBOARD.key, 'Content-Type': 'application/json' }, LEADERBOARD.key.startsWith('eyJ') ? { Authorization: 'Bearer ' + LEADERBOARD.key } : {});
function playerId() {
  let id = store.get('player', null);
  if (!id) { id = [...crypto.getRandomValues(new Uint8Array(9))].map(b => b.toString(36).padStart(2, '0')).join(''); store.set('player', id); }
  return id;

function postScore(daily, game, t, hints, tries) {
  const day = dDay(daily), level = dLevel(daily);
  const q = store.get('lbQueue', []).filter(x => !(x.day === day && x.game === game && (x.level || 'normal') === level));
  q.push({ day, game, level, t, hints, tries: tries || 0 }); store.set('lbQueue', q); return flushScores();
}
async function flushScores() {
  if (!lbOn() || !S.playerName) return false;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yday = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`;
  const q = store.get('lbQueue', []).filter(x => x.day >= yday);   // older ones can't be posted any more
  if (!q.length) { store.set('lbQueue', []); return true; }
  let left = q.slice(), ok = true;
  for (const part of [q.filter(x => x.game !== 'chess'), q.filter(x => x.game === 'chess')]) {
    if (!part.length) continue;
    const rows = part.map(x => ({ day: x.day, game: x.game, level: x.level || 'normal', player: playerId(), name: S.playerName, seconds: Math.max(1, x.t), hints: x.hints || 0, attempts: x.tries || 0 }));
    try {
      const r = await fetch(lbApi('daily_scores?on_conflict=day,game,level,player'), { method: 'POST', headers: Object.assign(lbHeaders(), { Prefer: 'resolution=ignore-duplicates,return=minimal' }), body: JSON.stringify(rows) });
      if (r.ok) left = left.filter(x => !part.includes(x)); else ok = false;
    } catch (e) { ok = false; }
  }
  store.set('lbQueue', left); return ok;
}

function dailyStreak() {

  const d = new Date(); let n = 0;

/* ---------- PUZZLE ORDER ---------- */
SCREENS.order = scr => {
  function draw() {
    const o = puzzleOrder();
    scr.el.innerHTML = `${bar(btnBack)}<div class="scroll"><div class="h1">${T.orderRow}</div><p class="note top">${T.orderHelp}</p>
      <div class="group ordlist">${o.map((g, i) => `<div class="row ordrow" data-g="${g}"><span class="pos">${i + 1}</span><span class="hart">${art(g)}</span><span class="lab">${GAMES[g].name}</span><span class="grip" aria-label="${T.dragToMove}">${I.grip}</span></div>`).join('')}</div>
      <div class="btns cbtns"><button class="btn ghost" data-reset>${T.orderReset}</button></div></div>`;
  }
  draw();
  // Pick a row up and drag it; the others slide out of the way, and it drops into the gap
  let d = null;
  scr.el.addEventListener('pointerdown', e => {
    const row = e.target.closest('.ordrow'); if (!row || d) return;
    const rows = $$('.ordrow', scr.el), tops = rows.map(r => r.getBoundingClientRect().top);
    d = { row, rows, i: rows.indexOf(row), j: rows.indexOf(row), y: e.clientY, h: rows.length > 1 ? tops[1] - tops[0] : row.offsetHeight, on: false, id: e.pointerId };
    try { row.setPointerCapture(e.pointerId); } catch (x) {}
  });
  scr.el.addEventListener('pointermove', e => {
    if (!d || e.pointerId !== d.id) return;
    const dy = e.clientY - d.y;
    if (!d.on) { if (Math.abs(dy) < 5) return; d.on = true; d.row.classList.add('lift'); sfx.soft(); navigator.vibrate && navigator.vibrate(8); }
    e.preventDefault();
    const n = d.rows.length, lo = -d.i * d.h, hi = (n - 1 - d.i) * d.h, y = Math.max(lo - 12, Math.min(hi + 12, dy));
    d.row.style.transform = `translateY(${y}px) scale(1.03)`;
    const j = Math.max(0, Math.min(n - 1, d.i + Math.round(y / d.h)));
    if (j !== d.j) { d.j = j; sfx.tap(); }
    d.rows.forEach((r, k) => { if (r === d.row) return; r.style.transform = d.i < k && k <= j ? `translateY(${-d.h}px)` : j <= k && k < d.i ? `translateY(${d.h}px)` : ''; });
  });
  const up = e => {
    if (!d || e.pointerId !== d.id) return;
    const x = d; d = null;
    if (!x.on) return;
    x.row.classList.add('drop'); x.row.style.transform = `translateY(${(x.j - x.i) * x.h}px)`;
    setTimeout(() => {
      if (x.j !== x.i) { const o = puzzleOrder(), [g] = o.splice(x.i, 1); o.splice(x.j, 0, g); S.order = o; save(); }
      draw();
    }, 210);
  };
  scr.el.addEventListener('pointerup', up); scr.el.addEventListener('pointercancel', up);
  scr.el.addEventListener('click', e => {
    if (e.target.closest('[data-reset]')) {
      const before = $$('.ordrow', scr.el).map(r => [r.dataset.g, r.getBoundingClientRect().top]);
      S.order = PUZZLE_ORDER.slice(); save(); sfx.tap(); draw();
      // slide each row from where it was to its new place
      $$('.ordrow', scr.el).forEach(r => { const b = before.find(x => x[0] === r.dataset.g); if (b) r.animate([{ transform: `translateY(${b[1] - r.getBoundingClientRect().top}px)` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' }); });
    }
  });
};

/* ---------- PUZZLE COLOURS ---------- */
const PRESETS = ['#ef4444', '#f97316', '#f59e0b', '#facc15', '#84cc16', '#22c55e', '#14b8a6', '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#ec4899', '#f43f5e', '#a16207', '#64748b',
  '#c8605a', '#d47a45', '#c9a443', '#6fae7e', '#4fa3a0', '#5b86c4', '#8a76c9', '#c46a98', '#9a7350', '#8590a0', '#ffffff', '#111013'];
// One colour: built-in default, preset swatches, the phone's colour wheel, or a hex code. Changes apply straight away.
function pickColour({ title, value, def, set, done, first }) {
  let cur = toHex(value);
  const swatches = [...new Set([...(first || []), ...PRESETS])];
  sheet(`<h2>${title}</h2>
    <div class="cpre"><button class="cdef" data-p="def" style="--c:${def}"><span>${T.defaultColour}</span></button>${swatches.map(h => `<button data-p="${h}" style="--c:${h}" aria-label="${h}"></button>`).join('')}</div>
    <div class="cown"><label class="cwheel" style="--c:${cur}"><input type="color" value="${cur}" aria-label="${T.colourWheel}"><span>${T.colourWheel}</span></label>
      <input class="tin chex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="${T.pickHex}" value="${cur}"></div>
    <div class="btns"><button class="btn primary" data-x>${T.done}</button></div>`, (el, close) => {
    const wheel = $('input[type=color]', el), hex = $('.chex', el), lab = $('.cwheel', el);
    const show = (h, from) => { cur = h; lab.style.setProperty('--c', h); if (from !== wheel) wheel.value = h; if (from !== hex) hex.value = h; $$('.cpre [data-p]', el).forEach(b => b.classList.toggle('on', b.dataset.p === h)); };
    show(cur);
    $('.cpre', el).addEventListener('click', e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      if (b.dataset.p === 'def') { set(null); show(toHex(def)); } else { set(b.dataset.p); show(b.dataset.p); }
      sfx.tap();
    });
    wheel.addEventListener('input', () => { set(wheel.value); show(wheel.value, wheel); });
    hex.addEventListener('input', () => { let v = hex.value.trim(); if (v[0] !== '#') v = '#' + v; if (/^#[0-9a-f]{6}$/i.test(v)) { set(v.toLowerCase()); show(v.toLowerCase(), hex); } });
    $('[data-x]', el).onclick = () => { close(); done && done(); };
    el.parentNode.querySelector('.scrim').onclick = () => { close(); done && done(); };
  });
}
